name: Setup Environment
description: Install pnpm, set up Node.js with pnpm store cache, and install workspace dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: pnpm

    # The workspace links the `@rexezuge/*` packages from a sibling checkout
    # (`overrides` in pnpm-workspace.yaml), and a link resolves to the package's
    # built `dist/`. A runner has no sibling checkout, so materialize one before
    # `pnpm install` tries to resolve the overrides. `SDK_REF` is a repository
    # variable so a deployment can pin the SDK revision it ships with; it
    # defaults to the SDK's main branch.
    - name: Checkout SDK
      uses: actions/checkout@v6
      with:
        repository: Rexezuge-CloudflareWorkers/SDK
        ref: ${{ vars.SDK_REF || 'main' }}
        path: ../SDK

    - name: Install SDK Dependencies
      uses: ./.github/actions/retry-step
      with:
        command: pnpm --dir ../SDK install --frozen-lockfile
        max_attempts: '3'

    - name: Build SDK
      uses: ./.github/actions/retry-step
      with:
        command: pnpm --dir ../SDK build
        max_attempts: '2'

    - name: Install Dependencies
      uses: ./.github/actions/retry-step
      with:
        command: pnpm install
        max_attempts: '3'
