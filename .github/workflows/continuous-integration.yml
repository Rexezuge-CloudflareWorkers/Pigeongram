# Continuous Integration — the family's converged gate (the superset in
# `@rexezuge/tooling`'s `github/workflows/continuous-integration.yml`), trimmed
# to the jobs that gate something in this repository and split per tool the way
# the sibling repos ship it.
#
# Dropped against the superset, with the reason:
#   * locales — no locale bundles here.
#   * migration lock — no D1; the session engine's storage is the Durable Object's
#     SQLite, migrated by the `durable_objects` migrations in
#     worker/wrangler.template.jsonc, and the family's `validate:migrations`
#     script has no counterpart here.
#   * web-tests / integration-tests — this repo runs one Vitest config whose two
#     projects partition the suite (see vitest.config.mts), so `unit-tests`
#     already runs everything; there is nothing to run under the Workers pool yet.
#   * floci-smoke — no AWS clients and no service emulator.
#   * spa-shell — the worker is API-only and serves no embedded shell.
#
# A job per gate because a failure is then named by the job rather than arriving
# inside a combined `checks` log, and a retry re-runs only the tool that broke.
# Job `name:` values — Typecheck, Lint, Format, God Files, Unit Tests, Build Web
# App — are the required-check names configured in branch protection; keep them
# stable.

name: Continuous Integration

permissions:
  contents: read

on:
  repository_dispatch:
    types:
      - Upstream Sync Integration
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # `pnpm run typecheck` reaches every workspace package and the repo's own
      # scripts (see the root package.json).
      - name: Run Typecheck
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run typecheck
          max_attempts: '2'

  # Lint and typecheck share nothing: `noEmit` everywhere, no project references,
  # and ESLint builds its own TS program, so neither consumes the other's output.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Lint
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run lint
          max_attempts: '2'

  # Its own job, and read-only, because the lint job cannot catch this:
  # `pnpm run lint` is `eslint --fix --quiet`, and `--fix` repairs what it can
  # while `--quiet` suppresses the rest — so CI can exit 0 on a tree Prettier
  # rejects, the repairs land in the runner's checkout, and they are thrown away.
  # `prettier --check` is the one command that fails instead of repairing, so it
  # is deliberately not retried: a formatting failure is a defect, not a flake.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Formatting
        run: pnpm run format:check

  god-files:
    name: God Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # A file growing past the limit is invisible to typecheck, lint, and the
      # tests — they all pass perfectly well on a 500-line component.
      - name: Check God-Files
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run check:god-files
          max_attempts: '2'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # One Vitest run, both projects (worker under `node`, SPA under jsdom).
      - name: Run Tests with Coverage
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test:coverage
          max_attempts: '2'

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Only the SPA build. The worker is covered by the `typecheck` job
  # (`pnpm -r typecheck` reaches worker/); `wrangler deploy --dry-run` in CD is
  # what proves it bundles.
  build:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: pnpm --filter @telegram-web-client/pages build

  dependabot-auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.state == 'open' && !github.event.repository.fork }}
    name: Auto-Merge Dependabot PR
    needs:
      - typecheck
      - lint
      - format
      - god-files
      - unit-tests
      - build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Auto-merge only after every gate above is green, which is what makes it
      # safe: a dependency bump that breaks the suite waits for a human instead
      # of merging itself.
      - name: Enable Auto-Merge
        uses: ./.github/actions/retry-step
        with:
          command: gh pr merge --auto --merge "$PR_URL"
          max_attempts: '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  dispatch-upstream-sync-deployment:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'Upstream Sync Integration' }}
    name: Dispatch Upstream Sync Deployment
    needs:
      - typecheck
      - lint
      - format
      - god-files
      - unit-tests
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # The second half of the upstream-sync contract: a fork's sync runs CI,
      # and CI — not the sync workflow — is what authorises the deploy.
      - name: Dispatch Deployment
        uses: ./.github/actions/retry-step
        with:
          command: >
            printf '{"event_type":"Upstream Sync Deployment","client_payload":{"branch":"%s","sha":"%s"}}\n'
            "$PAYLOAD_BRANCH" "$PAYLOAD_SHA"
            | gh api repos/${{ github.repository }}/dispatches --method POST --input -
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.sha }}
