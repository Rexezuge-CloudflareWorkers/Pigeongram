# Scheduled Version Update — stamp .github/.version twice a month.
#
# The stamp is the family's cache-buster. Nothing in this repository reads it
# today — the siblings' deploy workflows and backup branch names do — so here it
# is a marker that keeps the file's shape identical across the family. Forked
# repos skip the schedule (`if: !github.event.repository.fork`) because a fork
# must not race its upstream's push.

name: Scheduled Version Update

on:
  schedule:
    - cron: '0 0 1,15 * *'

permissions:
  contents: write

jobs:
  update-version:
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Write Current Unix Timestamp
        run: date +%s > .github/.version

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/.version

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "CHORE: Version Update"

          # The push is the one step that races the repository's own CI, so it is
          # retried rather than failing the run on a transient rejection.
          for i in {1..3}; do
            if git push; then
              break
            fi
            if [ $i -lt 3 ]; then sleep 10; else exit 1; fi
          done
