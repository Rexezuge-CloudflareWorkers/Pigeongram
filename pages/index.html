<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Web Client</title>
    <!--
      The favicon is inlined as a data URI so the icon travels with the document:
      there is no `pages/public/` asset to add, no extra request for the browser to
      make, and no second copy to drift out of sync with this one. Edit it and
      re-run `pnpm --filter @telegram-web-client/pages build`, or Pages keeps
      serving the previous bundle.

      The mark is a folded paper plane — the send action this client exists for.
      It is drawn for a 16px tab: two solid fills and no thin strokes, so the fold
      survives the downscale. Colours are `base.css` tokens: `--bg` for the tile,
      `--accent` for the upper wing and `--badge` for the underside. Nothing
      asserts that parity, so a palette change can leave this stale.
    -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%230e1621%22%2F%3E%3Cpath%20d%3D%22M27%204.5%204.5%2013%2014.5%2018z%22%20fill%3D%22%235eb5f7%22%2F%3E%3Cpath%20d%3D%22M27%204.5%2014.5%2018%2018%2027z%22%20fill%3D%22%233f8fd0%22%2F%3E%3C%2Fsvg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
