# Android Build — build one deployment's own in-app WebView shell.
#
# This workflow is deliberately manual-dispatch only. The APK bakes in the
# origin, package id and signing key, so a build belongs to exactly one
# deployment. Publishing a generic, upstream-signed APK would point every
# installer at the upstream origin and make the upstream key the update
# authority.
#
# The shell is a native activity hosting a WebView; it is not a Trusted Web
# Activity and needs no Digital Asset Links file. It still uses the deployment's
# package id and key, so each deployment forks the repository, sets its own
# variables and secrets, and runs this workflow. The signed APK/AAB are workflow
# artifacts only; there is intentionally no release upload and no
# `contents: write`.
#
# The decisions behind each step live in `scripts/android/`, one script per step,
# so this file stays a readable sequence of commands. The scripts are documented
# in `docs/ANDROID.md` and covered by `test/android/`.

name: Android Build

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'versionName (empty: latest tag, or 0.0.0-dev.<run>)'
        required: false
        type: string
      version_code:
        description: 'versionCode (empty: the workflow run number)'
        required: false
        type: string

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      ANDROID_PWA_ORIGIN: ${{ vars.ANDROID_PWA_ORIGIN }}
      ANDROID_PACKAGE_ID: ${{ vars.ANDROID_PACKAGE_ID }}
      ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
      # The web brand first, so a fork sets `VITE_APP_NAME` once. The Android
      # variables stay the per-shell override; the launcher name is what Android
      # shows under the icon and is best kept to 12 characters or fewer.
      ANDROID_APP_NAME: ${{ vars.ANDROID_APP_NAME || vars.VITE_APP_NAME || 'Pigeongram' }}
      ANDROID_LAUNCHER_NAME: ${{ vars.ANDROID_LAUNCHER_NAME || vars.VITE_APP_SHORT_NAME || vars.VITE_APP_NAME || 'Pigeongram' }}
      GRADLE_VERSION: '8.14.3'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # Tags are where the default version name comes from.
          fetch-depth: 0
          persist-credentials: false

      # Node, pnpm and the workspace dependencies, which is what makes `tsx`
      # available for the step scripts below.
      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The runner image carries the Android SDK, but not necessarily the
      # platform and build-tools the app compiles against.
      - name: Setup Android SDK
        run: pnpm exec tsx scripts/android/setup-sdk.ts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Validate Configuration
        env:
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm exec tsx scripts/android/validate-config.ts

      - name: Decode Signing Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: pnpm exec tsx scripts/android/decode-keystore.ts

      # The WebView loads the live origin, so Pages has to be deployed before
      # this workflow is useful. A stale deployment fails here, not on a phone.
      - name: Verify Live Deployment
        run: pnpm exec tsx scripts/android/verify-deployment.ts

      - name: Render Android Project
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: pnpm exec tsx scripts/android/render-android-project.ts

      - name: Build Android Packages
        run: pnpm exec tsx scripts/android/build-app.ts

      - name: Verify Signatures
        run: pnpm exec tsx scripts/android/verify-signatures.ts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ env.VERSION_NAME }}-${{ env.ANDROID_PACKAGE_ID }}
          path: |
            android/build/app-release-signed.apk
            android/build/app-release-bundle.aab
            android/build/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Build Summary
        run: pnpm exec tsx scripts/android/write-summary.ts

      - name: Remove Signing Material
        if: always()
        run: |
          if [ -n "${ANDROID_KEYSTORE_PATH:-}" ]; then
            rm -f "$ANDROID_KEYSTORE_PATH"
          fi
          if [ -f android/build/keystore.properties ]; then
            rm -f android/build/keystore.properties
          fi
