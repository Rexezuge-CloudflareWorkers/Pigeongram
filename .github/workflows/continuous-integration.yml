# Continuous Integration — the family's converged gate (the superset in
# `@rexezuge/tooling`'s `github/workflows/continuous-integration.yml`), trimmed
# to the jobs that gate something in this repository and split per tool the way
# the sibling repos ship it.
#
# Dropped against the superset, with the reason:
#   * locales — no locale bundles here.
#   * migration lock — no D1; the session engine's storage is the Durable Object's
#     SQLite, migrated by the `durable_objects` migrations in
#     apps/api/wrangler.template.jsonc, and the family's `validate:migrations`
#     script has no counterpart here.
#   * web-tests / integration-tests — this repo runs one Vitest config whose two
#     projects partition the suite (see vitest.config.mts), so `unit-tests`
#     already runs everything; there is nothing to run under the Workers pool yet.
#   * floci-smoke — no AWS clients and no service emulator.
#   * spa-shell — the worker is API-only and serves no embedded shell.
#
# A job per gate because a failure is then named by the job rather than arriving
# inside a combined `checks` log, and a retry re-runs only the tool that broke.
# Job `name:` values — Typecheck, Lint, Format, God Files, Unit Tests, Worker
# Bundle, Build Web App — are the required-check names configured in branch
# protection; keep them stable.

name: Continuous Integration

permissions:
  contents: read

on:
  repository_dispatch:
    types:
      - Upstream Sync Integration
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # `pnpm run typecheck` reaches every workspace package and the repo's own
      # scripts (see the root package.json).
      - name: Run Typecheck
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run typecheck
          max_attempts: '2'

  # Lint and typecheck share nothing: `noEmit` everywhere, no project references,
  # and ESLint builds its own TS program, so neither consumes the other's output.
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Run Lint
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run lint
          max_attempts: '2'

  # Its own job, and read-only, because the lint job cannot catch this:
  # `pnpm run lint` is `eslint --fix --quiet`, and `--fix` repairs what it can
  # while `--quiet` suppresses the rest — so CI can exit 0 on a tree Prettier
  # rejects, the repairs land in the runner's checkout, and they are thrown away.
  # `prettier --check` is the one command that fails instead of repairing, so it
  # is deliberately not retried: a formatting failure is a defect, not a flake.
  format:
    name: Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Check Formatting
        run: pnpm run format:check

  god-files:
    name: God Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # A file growing past the limit is invisible to typecheck, lint, and the
      # tests — they all pass perfectly well on a 500-line component.
      - name: Check God-Files
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run check:god-files
          max_attempts: '2'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      # One Vitest run, both projects (backend under `node`, SPA under jsdom).
      - name: Run Tests with Coverage
        uses: ./.github/actions/retry-step
        with:
          command: pnpm run test:coverage
          max_attempts: '2'

      - name: Upload Coverage Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

  # Only the SPA build. The worker is covered by the `typecheck` job
  # (`pnpm -r typecheck` reaches apps/api/) and by the `worker-bundle` job; CD's
  # dry run is the last gate before a deploy, not the first.
  build:
    name: Build Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Build Web App
        run: pnpm --filter @pigeongram/web build

  # A bundle is not a typecheck. Only `wrangler deploy --dry-run` proves that the
  # wasm module resolves, the Durable Object class is exported through the entry,
  # and the template's bindings still line up. CD runs the same dry run after
  # merge — one PR too late: a broken bundle would land on `main` and only fail
  # when the deploy starts. Needs no secrets: the config is materialized from the
  # committed template, and a dry run never calls the Cloudflare API.
  #
  # The job runs on every event so it is safe as a required check: workflow-level
  # `paths:` filtering leaves a required check pending on the PRs it skipped, and
  # a job-level `if:` cannot read a step's change-set output. The step below
  # decides whether the bundle is worth the install; `apps/web/`, `functions/` and
  # `docs/` cannot change the worker bundle.
  worker-bundle:
    name: Worker Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          # The change set is diffed against the base commit, which the default
          # single-commit clone does not contain.
          fetch-depth: 0

      - name: Detect Bundle Changes
        id: changed
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual or upstream-sync dispatch has no change set to compare and is
          # an explicit request to run the gate.
          case "$EVENT_NAME" in
            pull_request|push) ;;
            *)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # The first push to a branch has no parent to compare with.
          case "$BASE_SHA" in
            ''|0000000000000000000000000000000000000000)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac
          # Three dots: the PR's own changes, not whatever landed on the base
          # branch while the PR was open. A change set that cannot be computed
          # runs the gate rather than skipping it.
          if ! diff="$(git diff --name-only "$BASE_SHA"...HEAD)"; then
            echo 'Could not compute the change set; running the gate.'
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          matched="$(printf '%s\n' "$diff" | grep -E '^(apps/api/|packages/|scripts/lib/|scripts/wrangler-config/|scripts/prepare-wrangler-config\.ts$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|\.npmrc$)' || true)"
          if [ -n "$matched" ]; then
            printf 'Bundle-affecting changes:\n%s\n' "$matched"
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No bundle-affecting changes; skipping the dry run.'
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Environment
        if: steps.changed.outputs.run == 'true'
        uses: ./.github/actions/setup-env

      # The same materialization CD uses, deliberately without the deployment's
      # variable patches: the gate is the committed template, so a PR cannot pass
      # on configuration the repository does not carry.
      - name: Prepare Wrangler Configuration
        if: steps.changed.outputs.run == 'true'
        run: pnpm exec tsx scripts/prepare-wrangler-config.ts

      # Not retried, for the same reason as CD's dry run: a failure here is a
      # defect in the bundle, and retrying only delays the report.
      - name: Dry Run Deploy with Wrangler
        if: steps.changed.outputs.run == 'true'
        run: pnpm exec wrangler deploy --dry-run

  dependabot-auto-merge:
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' && github.event.pull_request.state == 'open' && !github.event.repository.fork }}
    name: Auto-Merge Dependabot PR
    needs:
      - typecheck
      - lint
      - format
      - god-files
      - unit-tests
      - worker-bundle
      - build
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # Auto-merge only after every gate above is green, which is what makes it
      # safe: a dependency bump that breaks the suite waits for a human instead
      # of merging itself.
      - name: Enable Auto-Merge
        uses: ./.github/actions/retry-step
        with:
          command: gh pr merge --auto --merge "$PR_URL"
          max_attempts: '5'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  dispatch-upstream-sync-deployment:
    if: ${{ github.event_name == 'repository_dispatch' && github.event.action == 'Upstream Sync Integration' }}
    name: Dispatch Upstream Sync Deployment
    needs:
      - typecheck
      - lint
      - format
      - god-files
      - unit-tests
      - worker-bundle
      - build
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      # The second half of the upstream-sync contract: a fork's sync runs CI,
      # and CI — not the sync workflow — is what authorises the deploy.
      - name: Dispatch Deployment
        uses: ./.github/actions/retry-step
        with:
          command: >
            printf '{"event_type":"Upstream Sync Deployment","client_payload":{"branch":"%s","sha":"%s"}}\n'
            "$PAYLOAD_BRANCH" "$PAYLOAD_SHA"
            | gh api repos/${{ github.repository }}/dispatches --method POST --input -
          max_attempts: '2'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAYLOAD_BRANCH: ${{ github.event.client_payload.branch || 'main' }}
          PAYLOAD_SHA: ${{ github.event.client_payload.sha || github.sha }}
