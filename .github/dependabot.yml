# Dependabot — weekly dependency updates, grouped so one PR covers the
# toolchain rather than twelve separate ones. @rexezuge/* updates land in
# their own group, which is the kit's upgrade path: a bump PR per repo, and
# the repo's own CI is the gate.

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    labels:
      - 'dependencies'
    # `typescript` stays on 6.x until typescript-eslint supports the TS 7 API
    # (it declares a peer range of >=4.8.4 <6.1.0; see typescript-eslint#10940).
    ignore:
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      kit:
        patterns:
          - '@rexezuge/*'
      toolchain:
        patterns:
          - 'typescript'
          - 'vitest'
          - '@vitest/coverage-v8'
          - 'vite'
          - 'eslint'
          - 'typescript-eslint'
          - 'prettier'
          - 'wrangler'
      cloudflare:
        patterns:
          - '@cloudflare/*'
